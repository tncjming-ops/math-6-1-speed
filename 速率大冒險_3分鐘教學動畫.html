<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>六上數學 第7單元｜速率大冒險（3分鐘教學動畫）</title>
  <style>
    :root {
      --bg-dark: #0b132b;
      --bg-stage: #121f3d;
      --card-bg: #1c2d52;
      --border: #2e4372;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --gold: #fbbf24;
      --cyan: #38bdf8;
      --emerald: #34d399;
      --coral: #fb7185;
      --violet: #a78bfa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1b2a4e 0%, #090e1d 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      user-select: none;
    }

    .player-shell {
      width: 100%;
      max-width: 1120px;
      background: var(--bg-stage);
      border: 2px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px;
      background: rgba(11, 19, 43, 0.85);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .brand .badge {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #0b132b;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 900;
    }

    .scene-pill {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--cyan);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* Stage */
    .stage-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, #132245 0%, #0d1730 100%);
      overflow: hidden;
    }

    /* Subtle grid background */
    .stage-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .scene-canvas {
      position: absolute;
      inset: 0;
      padding: 28px 36px 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Start Overlay */
    .start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 14, 29, 0.88);
      backdrop-filter: blur(8px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.35s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-overlay h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #fbbf24, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .start-overlay p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 560px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .big-play-btn {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #0b132b;
      border: none;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(251, 191, 36, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .big-play-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 36px rgba(251, 191, 36, 0.5);
    }

    /* Subtitles Bar */
    .subtitle-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 920px;
      background: rgba(9, 14, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 10px 20px;
      text-align: center;
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      line-height: 1.55;
      color: #fff;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: opacity 0.25s ease;
    }

    .subtitle-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Controls */
    .controls {
      background: rgba(11, 19, 43, 0.95);
      border-top: 1px solid var(--border);
      padding: 12px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-label {
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 44px;
    }

    .progress-track {
      position: relative;
      flex: 1;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--cyan));
      border-radius: 999px;
      transition: width 0.08s linear;
    }

    .chapter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chap-btn {
      background: #1a2747;
      border: 1px solid #2e4372;
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chap-btn:hover {
      background: #253863;
      color: #fff;
    }

    .chap-btn.active {
      background: rgba(251, 191, 36, 0.18);
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: #1e2f54;
      border: 1px solid #354c80;
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .ctrl-btn:hover {
      background: #2b4170;
    }

    .ctrl-btn.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #0b132b;
    }

    .ctrl-btn.primary:hover {
      background: #f59e0b;
    }

    /* Scene Graphic Components */
    .scene-title {
      font-size: clamp(1.35rem, 2.5vw, 2rem);
      font-weight: 900;
      margin-bottom: 18px;
      text-align: center;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    .card {
      background: rgba(28, 45, 82, 0.88);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    .formula-box {
      background: rgba(11, 19, 43, 0.8);
      border: 2px solid var(--cyan);
      border-radius: 14px;
      padding: 12px 24px;
      font-size: clamp(1.1rem, 2vw, 1.55rem);
      font-weight: 900;
      color: #fff;
      text-align: center;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
    }

    .highlight-gold { color: var(--gold); }
    .highlight-cyan { color: var(--cyan); }
    .highlight-emerald { color: var(--emerald); }
    .highlight-coral { color: var(--coral); }

    /* Track Animation */
    .track-box {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lane {
      position: relative;
      height: 64px;
      background: #263554;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      padding: 0 16px;
      overflow: hidden;
    }

    .finish-line {
      position: absolute;
      right: 54px;
      top: 0;
      bottom: 0;
      width: 8px;
      background: repeating-linear-gradient(
        0deg,
        #fff 0px, #fff 8px,
        #0b132b 8px, #0b132b 16px
      );
    }

    .runner {
      position: absolute;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1rem;
      transition: left 0.08s linear;
    }

    .runner-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    /* 3 Brothers Grid */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 920px;
    }

    .brother-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, border-color 0.3s ease;
    }

    .brother-card.dim {
      opacity: 0.25;
      transform: scale(0.92);
    }

    .brother-card.pop {
      opacity: 1;
      transform: scale(1.03);
      border-color: var(--gold);
      box-shadow: 0 0 28px rgba(251, 191, 36, 0.25);
    }

    /* Magic Pyramid */
    .pyramid-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      width: 100%;
      max-width: 880px;
    }

    /* Gear Conversion */
    .gear-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 880px;
    }

    .unit-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .unit-node {
      background: #1c2d52;
      border: 2px solid var(--cyan);
      border-radius: 14px;
      padding: 12px 22px;
      font-size: 1.25rem;
      font-weight: 900;
      min-width: 120px;
      text-align: center;
    }

    .op-badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.95rem;
    }

    .op-div { background: rgba(251, 113, 133, 0.2); border: 1.5px solid var(--coral); color: var(--coral); }
    .op-mul { background: rgba(52, 211, 153, 0.2); border: 1.5px solid var(--emerald); color: var(--emerald); }

    /* Trap Cards */
    .trap-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 920px;
    }

    .trap-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .trap-card.active {
      border-color: var(--gold);
      box-shadow: 0 0 28px rgba(251, 191, 36, 0.2);
    }

    .wrong-box {
      background: rgba(251, 113, 133, 0.14);
      border: 1.5px solid var(--coral);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fecdd3;
      font-weight: 700;
    }

    .right-box {
      background: rgba(52, 211, 153, 0.14);
      border: 1.5px solid var(--emerald);
      border-radius: 10px;
      padding: 8px 12px;
      color: #a7f3d0;
      font-weight: 700;
    }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 880px;
    }

    .sum-item {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0.25;
      transform: translateY(10px);
      transition: all 0.35s ease;
    }

    .sum-item.show {
      opacity: 1;
      transform: translateY(0);
      border-color: var(--emerald);
    }

    .sum-num {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--gold);
      color: #0b132b;
      font-weight: 900;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .pulse {
      animation: pulseGlow 1.6s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="player-shell" id="playerShell">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <span class="badge">六上數學 Ch.7</span>
        <span>🚀 速率大冒險：3分鐘觀念全攻略</span>
      </div>
      <div class="scene-pill" id="scenePill">準備播放</div>
    </div>

    <!-- Main Animation Stage -->
    <div class="stage-wrapper" id="stageWrapper">
      <div class="scene-canvas" id="sceneCanvas"></div>

      <!-- Start Overlay -->
      <div class="start-overlay" id="startOverlay">
        <h1>🚀 速率大冒險！</h1>
        <p>
          從頭到尾帶六年級小朋友一次搞懂「秒速、分速、時速」、<br />
          「神奇公式金字塔」、「單位換算口訣」與「考試必避陷阱」！
        </p>
        <button class="big-play-btn" id="bigPlayBtn">
          <span>▶</span> 開始播放動畫（約 3 分鐘）
        </button>
      </div>

      <!-- Subtitles -->
      <div class="subtitle-bar" id="subtitleBar">點擊「開始播放動畫」即可同步收看口白與動畫！</div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="timeline-row">
        <span class="time-label" id="currTimeLabel">00:00</span>
        <div class="progress-track" id="progressTrack" title="點擊跳轉進度">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-label" id="totalTimeLabel">03:06</span>
      </div>

      <div class="chapter-tabs" id="chapterTabs"></div>

      <div class="btn-row">
        <div class="btn-group">
          <button class="ctrl-btn primary" id="playPauseBtn">▶ 播放</button>
          <button class="ctrl-btn" id="prevBtn">⏮ 上一段</button>
          <button class="ctrl-btn" id="nextBtn">下一段 ⏭</button>
          <button class="ctrl-btn" id="replayBtn">🔄 重播</button>
        </div>
        <div class="btn-group">
          <button class="ctrl-btn" id="speedBtn">語速 1.0x</button>
          <button class="ctrl-btn" id="subToggleBtn">💬 字幕：開</button>
          <button class="ctrl-btn" id="muteBtn">🔊 聲音：開</button>
          <button class="ctrl-btn" id="fsBtn">⛶ 全螢幕</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Scene definitions matching exact audio lengths generated from textbook Ch.7
    const SCENES = [
      {
        id: "s01",
        short: "1. 認識速率",
        title: "什麼是速率？怎麼比快慢？",
        audio: "audio/s01.mp3",
        duration: 24.76,
        subtitles: [
          { t: 0.0, text: "各位六年級的小朋友大家好！歡迎來到數學小教室，今天我們要一起破解「速率」的秘密！" },
          { t: 6.8, text: "操場上，介文和清吉都跑了 60 公尺，介文花 10 秒，清吉花 9 秒，時間越短跑得越快！" },
          { t: 15.2, text: "那如果距離和時間都不一樣呢？算出「平均 1 秒鐘移動幾公尺」，就能公平比快慢，這就是「速率」！" }
        ]
      },
      {
        id: "s02",
        short: "2. 速率種類",
        title: "速率三兄弟：秒速、分速、時速",
        audio: "audio/s02.mp3",
        duration: 23.14,
        subtitles: [
          { t: 0.0, text: "認識速率三兄弟！平均每秒鐘移動的距離叫「秒速」，例如鴕鳥每秒跑 18 公尺，記作 18 公尺/秒。" },
          { t: 8.8, text: "平均每分鐘移動的距離叫「分速」，像散步或騎腳踏車。" },
          { t: 13.6, text: "平均每小時移動的距離叫「時速」，像開車或高鐵時速 300 公里！" },
          { t: 19.0, text: "要記住喔，課本說的速率，指的都是「平均速率」！" }
        ]
      },
      {
        id: "s03",
        short: "3. 公式金字塔",
        title: "神奇公式金字塔",
        audio: "audio/s03.mp3",
        duration: 28.26,
        subtitles: [
          { t: 0.0, text: "算速率有三個黃金公式，記不住怎麼辦？快來畫一個「神奇金字塔」！距離在最頂端，速率和時間在下面。" },
          { t: 8.5, text: "想算誰，就用手把它遮起來！遮住速率 → 「速率 ＝ 距離 ÷ 時間」。" },
          { t: 16.5, text: "遮住距離，下面相乘 → 「距離 ＝ 速率 × 時間」。" },
          { t: 22.0, text: "遮住時間 → 「時間 ＝ 距離 ÷ 速率」。超簡單吧！" }
        ]
      },
      {
        id: "s04",
        short: "4. 單位換算",
        title: "大魔王一：單位換算怎麼算？",
        audio: "audio/s04.mp3",
        duration: 33.74,
        subtitles: [
          { t: 0.0, text: "接下來是同學最容易卡關的「單位換算」！記住口訣：時間變小用除法，時間變大用乘法！" },
          { t: 7.5, text: "時速換成 1 分鐘走多遠，時間變 60 分之一，要除以 60；分速換秒速，再除以 60！" },
          { t: 15.0, text: "反過來，秒速換分速、分速換時速，就要乘以 60！" },
          { t: 19.8, text: "如果碰到公里和公尺，別忘了 1 公里 ＝ 1000 公尺喔！" },
          { t: 24.5, text: "例如時速 7.2 公里 → 7200 公尺/時 → 連除兩次 60 → 答案就是秒速 2 公尺！" }
        ]
      },
      {
        id: "s05",
        short: "5. 必考陷阱",
        title: "大魔王二：必考兩大陷阱！",
        audio: "audio/s05.mp3",
        duration: 29.26,
        subtitles: [
          { t: 0.0, text: "寫考卷時一定要小心這兩個超級陷阱！第一，比快慢之前，「單位一定要統一」！" },
          { t: 7.0, text: "時速 75 公里和分速 1200 公尺，不能直接比大小，要把分速乘以 60 換成時速 72 公里，才能比出誰快！" },
          { t: 16.0, text: "第二，算「平均速率」，千萬不可以把兩個速率加起來除以 2！" },
          { t: 22.0, text: "一定要先算出總距離和總時間，再用「總距離 ÷ 總時間」，才不會掉進陷阱裡！" }
        ]
      },
      {
        id: "s06",
        short: "6. 追趕與相遇",
        title: "生活應用：追趕與相遇問題",
        audio: "audio/s06.mp3",
        duration: 24.15,
        subtitles: [
          { t: 0.0, text: "最後來看兩種常考的應用題。如果兩個人從同一個地方「同方向」出發，因為都在往前面跑，" },

    function playChime(freq = 587.33) {
      if (isMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.25, audioCtx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.26);
      } catch (e) {}
    }

      const s = Math.max(0, Math.floor(sec));

      subtitleBar.textContent = currentLine;
    }

    function renderFrame() {
      const sc = SCENES[currentSceneIdx];
      scenePill.textContent = `第 ${currentSceneIdx + 1}/${SCENES.length} 幕：${sc.title}`;
      stageCanvas.innerHTML = renderSceneContent(currentSceneIdx, sceneElapsed, sc.duration);
      updateSubtitle(sc, sceneElapsed);

      const globalT = getGlobalTime();
      currTimeLabel.textContent = formatTime(globalT);
      progressFill.style.width = `${Math.min(100, (globalT / TOTAL_DURATION) * 100)}%`;

      // Update active chapter tab
      Array.from(chapterTabs.children).forEach((btn, i) => {
        btn.classList.toggle("active", i === currentSceneIdx);
      });
    }

    function tick(now) {
      if (lastTimestamp === null) lastTimestamp = now;
      const dt = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      if (isPlaying) {
        if (activeAudio && !activeAudio.paused && activeAudio.duration > 0) {
          sceneElapsed = activeAudio.currentTime;
        } else {
          sceneElapsed += dt * playbackRate;
          if (sceneElapsed >= SCENES[currentSceneIdx].duration) {
            if (currentSceneIdx < SCENES.length - 1) {
              jumpToScene(currentSceneIdx + 1, true);
            } else {
              isPlaying = false;
              playPauseBtn.textContent = "▶ 播放";
            }
          }
        }
        renderFrame();
      }
      rafId = requestAnimationFrame(tick);
    }

    // Event Listeners
    bigPlayBtn.addEventListener("click", () => jumpToScene(0, true));
    playPauseBtn.addEventListener("click", togglePlay);
    prevBtn.addEventListener("click", () => jumpToScene(Math.max(0, currentSceneIdx - 1), true));
    nextBtn.addEventListener("click", () => jumpToScene(Math.min(SCENES.length - 1, currentSceneIdx + 1), true));
    replayBtn.addEventListener("click", () => jumpToScene(0, true));

    speedBtn.addEventListener("click", () => {
      const rates = [1.0, 1.15, 0.85];
      const next = rates[(rates.indexOf(playbackRate) + 1) % rates.length];
      playbackRate = next;
      speedBtn.textContent = `語速 ${playbackRate}x`;
      if (activeAudio) activeAudio.playbackRate = playbackRate;
    });

    subToggleBtn.addEventListener("click", () => {
      showSubtitles = !showSubtitles;
      subtitleBar.classList.toggle("hidden", !showSubtitles);
      subToggleBtn.textContent = showSubtitles ? "💬 字幕：開" : "💬 字幕：關";
    });

    muteBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? "🔇 聲音：關" : "🔊 聲音：開";
      if (activeAudio) activeAudio.muted = isMuted;
    });

    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        playerShell.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    progressTrack.addEventListener("click", (e) => {
      const rect = progressTrack.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      let targetGlobal = ratio * TOTAL_DURATION;
      let acc = 0;
      for (let i = 0; i < SCENES.length; i++) {
        if (targetGlobal <= acc + SCENES[i].duration || i === SCENES.length - 1) {
          currentSceneIdx = i;
          sceneElapsed = Math.max(0, targetGlobal - acc);
          startOverlay.classList.add("hidden");
          loadAndPlayAudio(i, sceneElapsed);
          renderFrame();
          break;
        }
        acc += SCENES[i].duration;
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowRight") {
        jumpToScene(Math.min(SCENES.length - 1, currentSceneIdx + 1), true);
      } else if (e.code === "ArrowLeft") {
        jumpToScene(Math.max(0, currentSceneIdx - 1), true);
      }
    });

    // Init
    renderFrame();
    rafId = requestAnimationFrame(tick);
  </script>
</body>
</html>
